<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Kairos, the Greek god of the right moment: a calm head with a single lock of hair rising in the wind">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#ffb066" stop-opacity=".62"/>
      <stop offset=".55" stop-color="#f04f23" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f04f23" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9d2"/>
      <stop offset="1" stop-color="#f3b185"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2b4f"/>
      <stop offset="1" stop-color="#1b1230"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8a2f10"/>
      <stop offset=".6" stop-color="#e2461b"/>
      <stop offset="1" stop-color="#ffa24a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- the moment: a glow and two arcs of time -->
  <circle cx="200" cy="215" r="196" fill="url(#glow)"/>
  <circle cx="200" cy="215" r="168" fill="none" stroke="#f04f23" stroke-opacity=".28" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
  <path d="M44 250 A168 168 0 0 1 118 84" fill="none" stroke="#ffb066" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>

  <!-- shoulders and robe -->
  <path d="M78 440 C78 372 128 336 200 336 C272 336 322 372 322 440 Z" fill="url(#robe)"/>
  <path d="M150 342 C170 372 190 384 200 440 M250 342 C230 372 210 384 200 440" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="3"/>
  <path d="M142 338 C160 358 180 366 200 366 C220 366 240 358 258 338" fill="none" stroke="#ffb066" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"/>

  <!-- neck -->
  <path d="M170 300 L170 346 C182 360 218 360 230 346 L230 300 Z" fill="#e9a577"/>

  <!-- ears and head (bald, smooth) -->
  <ellipse cx="113" cy="212" rx="12" ry="22" fill="#eba679"/>
  <ellipse cx="287" cy="212" rx="12" ry="22" fill="#eba679"/>
  <path d="M112 206 C112 132 150 98 200 98 C250 98 288 132 288 206 C288 270 254 324 200 324 C146 324 112 270 112 206 Z" fill="url(#skin)"/>
  <path d="M130 150 C146 120 176 106 200 106" fill="none" stroke="url(#edge)" stroke-width="10" stroke-linecap="round" opacity=".7"/>

  <!-- calm face -->
  <path d="M146 188 q18 -10 36 0 M218 188 q18 -10 36 0" fill="none" stroke="#7a4a2a" stroke-width="5" stroke-linecap="round"/>
  <path d="M152 212 q16 14 32 0 M216 212 q16 14 32 0" fill="none" stroke="#5a3320" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M200 214 q-6 26 -2 38 q4 5 12 2" fill="none" stroke="#d58a5e" stroke-width="4" stroke-linecap="round"/>
  <path d="M176 280 q24 18 48 0" fill="none" stroke="#b5543a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="148" cy="246" r="13" fill="#ff8a5a" opacity=".28"/>
  <circle cx="252" cy="246" r="13" fill="#ff8a5a" opacity=".28"/>

  <!-- the single lock, lifted by the wind -->
  <path d="M198 108 C186 76 194 38 224 18 C248 2 284 6 296 30 C306 52 290 74 268 70 C250 66 246 46 260 40 C246 36 232 48 232 66 C232 88 218 108 204 120 Z" fill="url(#lock)"/>
  <path d="M206 100 C198 76 206 48 226 30" fill="none" stroke="#ffd2a0" stroke-opacity=".75" stroke-width="4" stroke-linecap="round"/>
  <!-- wind lines around the lock -->
  <path d="M308 70 q22 -4 34 -22" fill="none" stroke="#ffb066" stroke-opacity=".75" stroke-width="4" stroke-linecap="round"/>
  <path d="M314 96 q26 -2 42 -20" fill="none" stroke="#ffb066" stroke-opacity=".5" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M160 52 q-20 -6 -34 6" fill="none" stroke="#ffb066" stroke-opacity=".5" stroke-width="3.5" stroke-linecap="round"/>

  <!-- sparks -->
  <g fill="#ffd9a8">
    <path d="M338 30 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
    <path d="M92 70 l2.4 7 7 2.4 -7 2.4 -2.4 7 -2.4 -7 -7 -2.4 7 -2.4z" opacity=".8"/>
    <path d="M352 150 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity=".65"/>
    <path d="M60 170 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity=".6"/>
  </g>
</svg>
